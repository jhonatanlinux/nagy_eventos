name: Android

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check native project
    runs-on: ubuntu-latest
    outputs:
      android-ready: ${{ steps.native.outputs.android-ready }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android wrapper
        id: native
        shell: bash
        run: |
          if [[ -f android/gradlew ]]; then
            echo "android-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "android-ready=false" >> "$GITHUB_OUTPUT"
            echo "## Android build skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The native Android project has not been generated yet. Run the dedicated Android setup phase before enabling artifact builds." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build Android artifacts
    needs: preflight
    if: needs.preflight.outputs.android-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build and synchronize web assets
        run: |
          npm run build
          npx cap sync android

      - name: Build APK and Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
